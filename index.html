<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahmad's AI Chat</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #e2e8f0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: rgba(15, 23, 42, 0.9);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .brand h1 {
            font-size: 20px;
            color: #38bdf8;
            font-weight: bold;
        }

        .brand p {
            font-size: 12px;
            color: #94a3b8;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .toolbar input[type="text"] {
            padding: 8px 12px;
            border-radius: 20px;
            border: 1px solid #334155;
            background: #1e293b;
            color: white;
            outline: none;
        }

        .toolbar input[type="text"]:focus {
            border-color: #38bdf8;
        }

        button {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        button:hover {
            background: #7dd3fc;
        }

        button.danger {
            background: #ef4444;
            color: white;
        }
        
        button.danger:hover {
            background: #f87171;
        }

        #chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 15px;
            line-height: 1.5;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-user {
            background: #38bdf8;
            color: #0f172a;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .msg-ai {
            background: #334155;
            color: #f8fafc;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #475569;
        }

        .input-area {
            padding: 20px;
            background: rgba(15, 23, 42, 0.9);
            border-top: 1px solid #334155;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-area input[type="text"] {
            flex: 1;
            padding: 15px;
            border-radius: 25px;
            border: 1px solid #475569;
            background: #1e293b;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .input-area input[type="text"]:focus {
            border-color: #38bdf8;
        }

        .mic-btn {
            background: #475569;
            color: white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }

        .mic-btn.listening {
            background: #ef4444;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .send-btn {
            padding: 15px 25px;
            border-radius: 25px;
            font-size: 16px;
        }

    </style>
</head>
<body>

    <header>
        <div class="brand">
            <h1>Ahmad AI</h1>
            <p>Built by Ahmad bin shifa</p>
        </div>
        <div class="toolbar">
            <input type="text" id="searchInput" placeholder="Search chat..." onkeyup="searchChat()">
            <button onclick="newChat()">+ Add Chat</button>
            <button class="danger" onclick="removeChat()">Remove Chat</button>
        </div>
    </header>

    <div id="chat-container">
        <!-- Initial Greeting -->
        <div class="message msg-ai">
            Hello! I am Ahmad AI. Try saying "hey", ask me "1+1", or tell me to "tell a joke"!
        </div>
    </div>

    <div class="input-area">
        <button id="micBtn" class="mic-btn" onclick="toggleMic()">🎤</button>
        <input type="text" id="messageInput" placeholder="Type a message..." onkeypress="handleEnter(event)">
        <button class="send-btn" onclick="sendMessage()">Send</button>
    </div>

    <!-- THIS IS THE SCRIPT SECTION -->
    <script>
        const chatContainer = document.getElementById("chat-container");
        const messageInput = document.getElementById("messageInput");
        const searchInput = document.getElementById("searchInput");
        const micBtn = document.getElementById("micBtn");

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isListening = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                messageInput.value = transcript;
                sendMessage(); 
            };

            recognition.onend = () => {
                isListening = false;
                micBtn.classList.remove("listening");
            };
        } else {
            micBtn.style.display = "none"; 
        }

        function toggleMic() {
            if (!recognition) return alert("Microphone not supported in this browser. Try Chrome.");
            
            if (isListening) {
                recognition.stop();
            } else {
                recognition.start();
                isListening = true;
                micBtn.classList.add("listening");
            }
        }

        // --- NEW AI BRAIN LOGIC ---
        async function sendMessage() {
            const text = messageInput.value.trim();
            if (text === "") return;

            // 1. Show your message
            addMessageToDOM(text, "msg-user");
            messageInput.value = "";
            searchInput.value = "";
            searchChat();

            // 2. The AI's "Brain"
            setTimeout(async () => {
                let botResponse = "";
                // Make the text lowercase and remove spaces so it's easier for the bot to understand
                let lowerText = text.toLowerCase().replace(/\s/g, ''); 

                // Rule 1: Greetings
                if (lowerText.includes("hey") || lowerText.includes("hello") || lowerText.includes("hi")) {
                    botResponse = "Hello Ahmad! How are you doing today?";
                }
                // Rule 2: Basic Math (like your 1plus1 example)
                else if (lowerText.includes("1plus1") || lowerText.includes("1+1")) {
                    botResponse = "That's easy! 1 + 1 equals 2.";
                }
                // Rule 3: Real Internet API Connection (Tells a joke)
                else if (lowerText.includes("joke")) {
                    botResponse = "Let me think of a good one... 🤔";
                    addMessageToDOM(botResponse, "msg-ai"); // Send placeholder
                    
                    try {
                        // This fetches a real joke from a free internet database!
                        let response = await fetch("https://v2.jokeapi.dev/joke/Any?safe-mode&type=single");
                        let data = await response.json();
                        botResponse = data.joke; 
                    } catch (error) {
                        botResponse = "Oops, my internet connection to the joke database failed!";
                    }
                }
                // Rule 4: Default Fallback if it doesn't know the answer
                else {
                    botResponse = "I don't know how to respond to that yet! Try saying 'hello', asking '1 + 1', or tell me to 'tell a joke'.";
                }

                // 3. Show the AI's response
                addMessageToDOM(botResponse, "msg-ai");

            }, 600); // Wait 0.6 seconds to make it feel like it's thinking
        }
        // -----------------------------

        function addMessageToDOM(text, className) {
            const msgDiv = document.createElement("div");
            msgDiv.classList.add("message", className);
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function handleEnter(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }

        function newChat() {
            chatContainer.innerHTML = `
                <div class="message msg-ai">
                    Started a new chat session! How can I help?
                </div>
            `;
            searchInput.value = "";
        }

        function removeChat() {
            if(confirm("Are you sure you want to delete all messages?")) {
                chatContainer.innerHTML = "";
            }
        }

        function searchChat() {
            const filter = searchInput.value.toLowerCase();
            const messages = chatContainer.getElementsByClassName("message");

            for (let i = 0; i < messages.length; i++) {
                const text = messages[i].innerText.toLowerCase();
                if (text.includes(filter)) {
                    messages[i].style.display = "block";
                } else {
                    messages[i].style.display = "none";
                }
            }
        }
    </script>
</body>
</html>
