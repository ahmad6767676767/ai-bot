<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahmad's AI Chat</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* A good-looking, modern dark gradient background */
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #e2e8f0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Navigation / Toolbar */
        header {
            background: rgba(15, 23, 42, 0.9);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .brand h1 {
            font-size: 20px;
            color: #38bdf8;
            font-weight: bold;
        }

        .brand p {
            font-size: 12px;
            color: #94a3b8;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .toolbar input[type="text"] {
            padding: 8px 12px;
            border-radius: 20px;
            border: 1px solid #334155;
            background: #1e293b;
            color: white;
            outline: none;
        }

        .toolbar input[type="text"]:focus {
            border-color: #38bdf8;
        }

        button {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        button:hover {
            background: #7dd3fc;
        }

        button.danger {
            background: #ef4444;
            color: white;
        }
        
        button.danger:hover {
            background: #f87171;
        }

        /* Chat Display Area */
        #chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 15px;
            line-height: 1.5;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-user {
            background: #38bdf8;
            color: #0f172a;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .msg-ai {
            background: #334155;
            color: #f8fafc;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #475569;
        }

        /* Input Area at the bottom */
        .input-area {
            padding: 20px;
            background: rgba(15, 23, 42, 0.9);
            border-top: 1px solid #334155;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-area input[type="text"] {
            flex: 1;
            padding: 15px;
            border-radius: 25px;
            border: 1px solid #475569;
            background: #1e293b;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .input-area input[type="text"]:focus {
            border-color: #38bdf8;
        }

        .mic-btn {
            background: #475569;
            color: white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }

        .mic-btn.listening {
            background: #ef4444;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .send-btn {
            padding: 15px 25px;
            border-radius: 25px;
            font-size: 16px;
        }

    </style>
</head>
<body>

    <header>
        <div class="brand">
            <h1>Ahmad AI</h1>
            <p>Built by Ahmad bin shifa</p>
        </div>
        <div class="toolbar">
            <input type="text" id="searchInput" placeholder="Search chat..." onkeyup="searchChat()">
            <button onclick="newChat()">+ Add Chat</button>
            <button class="danger" onclick="removeChat()">Remove Chat</button>
        </div>
    </header>

    <div id="chat-container">
        <!-- Initial Greeting -->
        <div class="message msg-ai">
            Hello! I am a simulated AI. Ask me anything, or try using the microphone!
        </div>
    </div>

    <div class="input-area">
        <button id="micBtn" class="mic-btn" onclick="toggleMic()">🎤</button>
        <input type="text" id="messageInput" placeholder="Type a message..." onkeypress="handleEnter(event)">
        <button class="send-btn" onclick="sendMessage()">Send</button>
    </div>

    <script>
        const chatContainer = document.getElementById("chat-container");
        const messageInput = document.getElementById("messageInput");
        const searchInput = document.getElementById("searchInput");
        const micBtn = document.getElementById("micBtn");

        // Speech Recognition Setup (Works in Chrome/Edge)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        let isListening = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                messageInput.value = transcript;
                sendMessage(); // Auto-send when voice is captured
            };

            recognition.onend = () => {
                isListening = false;
                micBtn.classList.remove("listening");
            };
        } else {
            micBtn.style.display = "none"; // Hide mic if browser doesn't support it
        }

        function toggleMic() {
            if (!recognition) return alert("Microphone not supported in this browser. Try Chrome.");
            
            if (isListening) {
                recognition.stop();
            } else {
                recognition.start();
                isListening = true;
                micBtn.classList.add("listening");
            }
        }

        function sendMessage() {
            const text = messageInput.value.trim();
            if (text === "") return;

            // 1. Add User Message
            addMessageToDOM(text, "msg-user");
            messageInput.value = "";

            // 2. Clear any active search so new messages are visible
            searchInput.value = "";
            searchChat();

            // 3. Simulate AI Thinking and Replying
            setTimeout(() => {
                const botResponse = "You just said: '" + text + "'. (I am currently a UI simulation. Connect me to a backend API to make me smart!)";
                addMessageToDOM(botResponse, "msg-ai");
            }, 1000);
        }

        function addMessageToDOM(text, className) {
            const msgDiv = document.createElement("div");
            msgDiv.classList.add("message", className);
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            
            // Scroll to the bottom
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function handleEnter(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }

        // Feature: Add Chat (Clears screen for a fresh start)
        function newChat() {
            chatContainer.innerHTML = `
                <div class="message msg-ai">
                    Started a new chat session! How can I help?
                </div>
            `;
            searchInput.value = "";
        }

        // Feature: Remove Chat (Deletes everything)
        function removeChat() {
            if(confirm("Are you sure you want to delete all messages?")) {
                chatContainer.innerHTML = "";
            }
        }

        // Feature: Search Chat (Filters visible messages)
        function searchChat() {
            const filter = searchInput.value.toLowerCase();
            const messages = chatContainer.getElementsByClassName("message");

            for (let i = 0; i < messages.length; i++) {
                const text = messages[i].innerText.toLowerCase();
                if (text.includes(filter)) {
                    messages[i].style.display = "block";
                } else {
                    messages[i].style.display = "none";
                }
            }
        }
    </script>
</body>
</html>
